name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK and accept licenses
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find Android SDK sdkmanager"
            find /usr/local/lib/android -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: GlassOverlay
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK was created
        run: |
          test -s GlassOverlay/app/build/outputs/apk/debug/app-debug.apk
          ls -lh GlassOverlay/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassOverlay-debug-apk
          path: GlassOverlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
